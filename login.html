<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Use Multi</title>
    <link rel="icon" type="image/png" href="img/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="page-transition" id="page-transition">
        <div class="spinner"></div>
    </div>
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-logo-space">
                <a href="index.html">
                    <img src="img/logo.jpg" alt="Logo Use Multi" class="logo-img">
                </a>
            </div>
            <h2 class="login-title">Acesse sua conta</h2>
            
            <form id="form-login" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="E-mail" required>
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Senha" required>
                </div>
                <div class="login-actions">
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>
                <button type="submit" class="btn-primary btn-block">Entrar no Sistema</button>
            </form>
            
            <div class="login-footer">
                <p>Ainda não é parceiro? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>
    <script>
        window.addEventListener('pageshow', () => {
            const transition = document.getElementById('page-transition');
            if (transition) transition.classList.add('loaded');
        });

        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const usuario = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (usuario === 'cliente@cliente.com' && senha === '1') {
                const transition = document.getElementById('page-transition');
                transition.classList.remove('loaded');
                
                setTimeout(() => window.location.href = 'dashboard.html', 400);
            } else  
            
            if (usuario === 'master@master.com' && senha === '1') {
                const transition = document.getElementById('page-transition');
                transition.classList.remove('loaded');
                
                setTimeout(() => window.location.href = 'dashboard-master.html', 400);
            } else {
                alert('Usuário ou senha incorretos!');
            }
        });

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                const target = this.getAttribute('href');
                if (target && target.endsWith('.html') && this.target !== '_blank') {
                    e.preventDefault();
                    const transition = document.getElementById('page-transition');
                    transition.classList.remove('loaded');
                    setTimeout(() => window.location.href = target, 400);
                }
            });
        });
    </script>
</body>
</html>
